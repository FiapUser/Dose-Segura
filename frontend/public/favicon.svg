<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Dose Segura">
  <defs>
    <linearGradient id="escudo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3fa9f5"/>
      <stop offset="55%" stop-color="#1b7fd4"/>
      <stop offset="100%" stop-color="#0b4ed8"/>
    </linearGradient>
    <linearGradient id="escudoBorda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fd8ff"/>
      <stop offset="100%" stop-color="#5fb4f2"/>
    </linearGradient>
    <linearGradient id="verde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3ec27a"/>
      <stop offset="100%" stop-color="#0e9f4a"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0b2545" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- escudo -->
  <path d="M32 4 8 12v20c0 13 10 24 24 28 14-4 24-15 24-28V12L32 4z"
        fill="url(#escudoBorda)"/>
  <path d="M32 8 12 14.6V32c0 11.3 8.6 20.8 20 24.2 11.4-3.4 20-12.9 20-24.2V14.6L32 8z"
        fill="url(#escudo)"/>

  <!-- relogio -->
  <circle cx="30.5" cy="27.5" r="14.5" fill="#ffffff"/>
  <g stroke="#123a63" stroke-linecap="round">
    <line x1="30.5" y1="27.5" x2="30.5" y2="17.5" stroke-width="3.2"/>
    <line x1="30.5" y1="27.5" x2="37.5" y2="30.5" stroke-width="3.2"/>
  </g>
  <circle cx="30.5" cy="27.5" r="2" fill="#123a63"/>
  <g fill="#9fc4e4">
    <circle cx="30.5" cy="14.6" r="1.15"/>
    <circle cx="30.5" cy="40.4" r="1.15"/>
    <circle cx="17.6" cy="27.5" r="1.15"/>
    <circle cx="43.4" cy="27.5" r="1.15"/>
  </g>

  <!-- selo de confirmacao -->
  <circle cx="46" cy="44" r="14" fill="url(#verde)" filter="url(#sombra)"/>
  <path d="M39 44.5l4.8 4.8 9.2-9.6" fill="none" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
