# =============================================================================
# DOSE SEGURA - configuracao unica (front + back na mesma aplicacao Java)
# Todos os valores saem do ambiente, para o mesmo arquivo funcionar em:
#   - docker compose (local)
#   - Render + Aiven MySQL (producao)
# Nao ha YAML de configuracao: o Render e configurado pelo painel + variaveis
# de ambiente descritas no README.
# =============================================================================

spring.application.name=dose-segura
server.port=${PORT:8080}
server.address=0.0.0.0

# -----------------------------------------------------------------------------
# Banco MySQL (Aiven em producao, container MySQL no compose)
# Aiven exige TLS; sslMode pode ser desativado via DB_SSL_MODE=preferido
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:db-dose-segura}:${DB_PORT:3306}/${DB_NAME:dosesegura}?useSSL=${DB_SSL:true}&requireSSL=${DB_SSL:true}&verifyServerCertificate=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC
spring.datasource.username=${DB_USER:usr}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=20000

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null

# -----------------------------------------------------------------------------
# Seguranca / JWT
# Defina JWT_SECRET (base64) no Render - sem ele a chave muda a cada reinicio.
# -----------------------------------------------------------------------------
dosegura.jwt.secret=${JWT_SECRET:}
dosegura.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
dosegura.cors.origens=${CORS_ORIGENS:http://localhost:5173,http://localhost:4173}

# -----------------------------------------------------------------------------
# Cloudinary (imagens de medicamentos, farmácias, fornecedores e perfis)
# Regra: master admin gerencia toda a rede; fornecedor envia logo + fotos dos
# seus medicamentos; farmácia envia a foto da unidade; paciente/cuidador envia
# apenas a própria foto de perfil.
# -----------------------------------------------------------------------------
dosegura.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
dosegura.cloudinary.api-key=${CLOUDINARY_API_KEY:}
dosegura.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
dosegura.cloudinary.folder=${CLOUDINARY_FOLDER:dose-segura}

# -----------------------------------------------------------------------------
# Uploads (imagens)
# -----------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_SIZE:5MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_SIZE:5MB}

# -----------------------------------------------------------------------------
# Dados iniciais (master admin + vitrine do marketplace).
# Em producao, rode com DOSEGURA_SEED_ENABLED=false depois do primeiro acesso.
# -----------------------------------------------------------------------------
dosegura.seed.enabled=${DOSEGURA_SEED_ENABLED:true}
dosegura.seed.master-admin.email=${MASTER_ADMIN_EMAIL:admin@dosesegura.com.br}
dosegura.seed.master-admin.senha=${MASTER_ADMIN_SENHA:DoseSegura@2026}
dosegura.seed.master-admin.nome=${MASTER_ADMIN_NOME:Administrador Dose Segura}
dosegura.seed.demo-paciente.email=${DEMO_PACIENTE_EMAIL:paciente@exemplo.com}
dosegura.seed.demo-paciente.senha=${DEMO_PACIENTE_SENHA:Paciente@2026}
dosegura.seed.demo-cuidador.email=${DEMO_CUIDADOR_EMAIL:cuidador@exemplo.com}
dosegura.seed.demo-cuidador.senha=${DEMO_CUIDADOR_SENHA:Cuidador@2026}
# Conta de instituicao: administra os registros do CNPJ informado e envia as imagens.
dosegura.seed.demo-instituicao.email=${DEMO_INSTITUICAO_EMAIL:parceira@dose-segura.com.br}
dosegura.seed.demo-instituicao.senha=${DEMO_INSTITUICAO_SENHA:Parceira@2026}
dosegura.seed.demo-instituicao.nome=${DEMO_INSTITUICAO_NOME:Eurofarma Brasil}
dosegura.seed.demo-instituicao.cnpj=${DEMO_INSTITUICAO_CNPJ:61.774.267/0001-00}
dosegura.seed.base-imagem=${CLOUDINARY_BASE_URL:https://res.cloudinary.com/dosegura/image/upload}

# -----------------------------------------------------------------------------
# Front
# -----------------------------------------------------------------------------
spring.web.resources.cache.cachecontrol.max-age=${STATIC_CACHE_DAYS:30}d
spring.web.resources.cache.cachecontrol.no-cache=false
